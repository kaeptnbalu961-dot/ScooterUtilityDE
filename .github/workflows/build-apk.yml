name: Android APK bauen

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Projekt herunterladen
        uses: actions/checkout@v4

      - name: Android-Projekt aus ZIP entpacken
        run: |
          mkdir -p build-src
          unzip -q ScooterUtilityDE_Android_Starter.zip -d build-src

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: APK bauen
        run: |
          gradle -p build-src assembleDebug

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: ScooterUtilityDE-debug
          path: build-src/app/build/outputs/apk/debug/app-debug.apk
